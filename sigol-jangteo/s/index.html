<style>
:root{--ink:#1b1b18;--sub:#6b665c;--line:#ddd6c8;--bg:#fbf8f2;--card:#fff;--acc:#c9572c}
@media (prefers-color-scheme:dark){:root{--ink:#f3efe6;--sub:#a8a294;--line:#34312b;--bg:#141311;--card:#1f1d1a;--acc:#f08a62}}
*{box-sizing:border-box}
html{font-size:18px;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;word-break:keep-all;line-height:1.45}
.w{max-width:30rem;margin:0 auto;padding:1.2rem 1.1rem 2rem;min-height:100vh;display:flex;flex-direction:column}
.brand{display:flex;align-items:center;gap:.45rem;font-size:.9rem;font-weight:800}
.brand svg{width:1.3rem;height:1.3rem;fill:var(--ink)}
.item{margin-top:1.4rem;background:var(--card);border:1px solid var(--line);border-radius:1.1rem;padding:1.1rem}
.item[hidden]{display:none}
.k{font-size:.8rem;font-weight:700;color:var(--acc)}
.item h1{font-size:1.45rem;margin:.35rem 0 .25rem;letter-spacing:-.02em;overflow-wrap:anywhere}
.d{font-size:1rem;font-weight:700}
.s{font-size:.85rem;color:var(--sub);margin-top:.3rem;overflow-wrap:anywhere}
.s a{color:var(--acc);font-weight:700}
.appline{display:flex;align-items:center;gap:.75rem;margin-top:1.4rem}
.appline img{width:3.4rem;height:3.4rem;border-radius:.8rem}
.appline b{display:block;font-size:1rem}.appline span{display:block;font-size:.85rem;color:var(--sub)}
.badges{display:flex;flex-direction:column;gap:.6rem;margin-top:1.1rem}
.badge{min-height:2.9rem;border-radius:.6rem;background:#000;color:#fff;display:flex;align-items:center;justify-content:center;gap:.5rem;font-size:.9rem;font-weight:700;border:1px solid #444;text-decoration:none;padding:.3rem .8rem}
.badge small{display:block;font-size:.65rem;font-weight:500;opacity:.85}
.badge .bx{display:flex;flex-direction:column;line-height:1.15}
.badge.dim{opacity:.6}
.soon{margin-top:.6rem;font-size:.85rem;color:var(--sub)}
.note{margin-top:.8rem;font-size:.85rem;color:var(--sub)}
.foot{margin-top:auto;padding-top:1.4rem;font-size:.8rem;color:var(--sub);display:flex;flex-wrap:wrap;gap:.3rem 1rem;justify-content:space-between}
.foot a{color:var(--sub)}
</style></head><body>

<div class="badges" id="badges"></div>
<div class="note" id="note"></div>
<div class="note">축제 정보를 받을 때는 우리 중계 서버(Cloudflare)에 축제 번호만 보내요. 장 정보는 이 사이트 파일에서 읽어요.</div>

</div>
<script>
(function(){
var APP={play:'https://play.google.com/store/apps/details?id=kr.co.codecat.achimhanjang',ios:'https://apps.apple.com/kr/app/id6832980986'};
var $=function(i){return document.getElementById(i)};
var P=new URLSearchParams(location.search);
var WD=['일','월','화','수','목','금','토'];
function ymd(s){var m=/^(\d{4})-?(\d{2})-?(\d{2})$/.exec(String(s||''));if(!m)return null;var y=+m[1],mo=+m[2],d=+m[3];var dt=new Date(y,mo-1,d);if(dt.getFullYear()!==y||dt.getMonth()!==mo-1||dt.getDate()!==d)return null;return dt}
function fmt(dt,withMonth){return (withMonth===false?'':(dt.getMonth()+1)+'월 ')+dt.getDate()+'일('+WD[dt.getDay()]+')'}
function show(k,h,d,s){var it=$('item');$('k').textContent=k;$('h').textContent=h;$('d').textContent=d||'';$('s').textContent=s||'';it.hidden=false;return $('s')}
function badges(){
 var ua=navigator.userAgent||'';var ios=/iPhone|iPad|iPod/.test(ua)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);var and=/Android/.test(ua);
 var b=$('badges');b.textContent='';
 function mk(label,store,url,dim){var a=document.createElement(url?'a':'div');a.className='badge'+(dim?' dim':'');if(url){a.href=url;a.rel='noopener'}var bx=document.createElement('span');bx.className='bx';var sm=document.createElement('small');sm.textContent=url?'다운로드하기':'준비 중이에요';bx.appendChild(sm);bx.appendChild(document.createTextNode(store));a.appendChild(bx);return a}
 var ap=mk('','App Store',APP.ios,false),gp=mk('','Google Play',APP.play,false);
 var first=ios?[ap,gp]:and?[gp,ap]:[gp,ap];
 first.forEach(function(x,i){if(i)x.classList.add('dim');b.appendChild(x)});
 if(!ios&&!and)$('note').textContent='휴대폰에서 열어 주세요.';
}

function bad(){return}
var t=P.get('t'),id=P.get('id'),dd=ymd(P.get('d'));
function ctl(ms){var c=new AbortController();setTimeout(function(){c.abort()},ms);return c.signal}
if(t==='m'&&/^m-[0-9a-f]{12}$/.test(id||'')){
 fetch('markets-public.json',{signal:ctl(8000),credentials:'omit',referrerPolicy:'no-referrer'}).then(function(r){if(!r.ok)throw 0;return r.json()}).then(function(j){
  var m=(j.items||[]).filter(function(x){return x&&x.id===id})[0];if(!m)return;
  var days=Array.isArray(m.days)?m.days.filter(function(n){return n>=1&&n<=30}):[];
  var name=String(m.name||'').slice(0,60),sg=String(m.sigungu||'').slice(0,30),cyc=String(m.cycleText||'').slice(0,20);
  var line='';
  if(dd&&days.length&&!m.checking){
   if(days.indexOf(dd.getDate())>=0)line=fmt(dd)+' 장이 서요';
   else{var n=null;for(var i=1;i<=62&&!n;i++){var x=new Date(dd.getFullYear(),dd.getMonth(),dd.getDate()+i);if(days.indexOf(x.getDate())>=0)n=x}
    line=n?('다음 장은 '+fmt(n)+'이에요'):'장날을 확인하고 있어요'}
  }else line=m.checking?'장날을 확인하고 있어요':(dd?fmt(dd):'');
  show('장 서는 날',name,line,(sg+(cyc?' · '+cyc:'')).trim());
 }).catch(bad);
}else if(t==='f'&&/^f-[0-9a-f]{12}$/.test(id||'')){
 fetch('https://sigol-jangteo-proxy.codecat-kr.workers.dev/v1/festival?id='+id,{signal:ctl(8000),credentials:'omit',referrerPolicy:'no-referrer'}).then(function(r){if(r.status!==200)throw 0;return r.json()}).then(function(j){
  var f=j&&j.festival;if(!f||!f.name)return;
  var a=ymd(f.start),b=ymd(f.end);var when='';
  if(a&&b){when=(a.getTime()===b.getTime())?fmt(a):fmt(a)+' – '+fmt(b,a.getMonth()!==b.getMonth())}else if(a)when=fmt(a);
  var place=String(f.place||'').slice(0,80),addr=String(f.addr||'').slice(0,100);
  var s=show('축제',String(f.name).slice(0,80),when,[place,addr].filter(Boolean).join(' · '));
  if(typeof f.url==='string'&&f.url.indexOf('https://')===0&&f.url.length<300){s.appendChild(document.createTextNode(' '));var a2=document.createElement('a');a2.href=f.url;a2.rel='noopener noreferrer nofollow';a2.textContent='공식 안내';s.appendChild(a2)}
 }).catch(bad);
}

badges();
})();
</script></body></html>
