<link rel="icon" type="image/svg+xml" href="company-mark.svg">
<style>
:root{--ink:#1c1c1e;--sub:#4a4a4f;--orange:#c46a00;--cream:#fff6e8;--line:#e7d7bd}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--cream);color:var(--ink);font-family:"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;font-size:20px;line-height:1.7}
a{color:var(--orange);font-weight:700}
a:focus-visible{outline:4px solid var(--ink);outline-offset:3px}
.wrap{max-width:860px;margin:0 auto;padding:0 20px}
header{background:#fff;border-bottom:3px solid var(--line);padding:28px 0}
.brand{display:flex;align-items:center;gap:16px}
.logo{height:48px;width:auto}
.name{font-size:34px;font-weight:900;letter-spacing:.02em}
h1{margin:36px 0 12px;font-size:clamp(30px,5.6vw,44px);line-height:1.3;font-weight:900}
.lead{margin:0 0 8px;font-size:clamp(20px,3vw,24px);color:var(--sub)}
section{padding:32px 0 4px}
h2{margin:0 0 14px;font-size:clamp(26px,4vw,30px);font-weight:900}
.card{background:#fff;border:2px solid var(--line);border-radius:20px;padding:22px 24px}
.card b{display:block;font-size:24px;margin-bottom:4px}
dl{margin:0;display:grid;grid-template-columns:max-content 1fr;gap:10px 22px}
dt{font-weight:900}
dd{margin:0}
ul.links{margin:0;padding:0;list-style:none;display:grid;gap:10px}
ul.links a{display:block;min-height:56px;padding:12px 18px;background:#fff;border:2px solid var(--line);border-radius:16px;text-decoration:none;font-size:21px}
footer{margin-top:40px;padding:24px 0 40px;border-top:3px solid var(--line);color:var(--sub);font-size:17px}
@media (max-width:520px){dl{grid-template-columns:1fr;gap:2px}dd{margin-bottom:12px}}
</style>
</head>
<body>
<header><div class="wrap brand"><img class="logo" src="company-mark.svg" alt="" height="48"><div class="name">코드캣(codecat)</div></div></header>

      광고는 지나치지 않게, 개인정보는 꼭 필요한 만큼만 다뤄요.
      <br><a href="https://codecat.co.kr/sarangbang/">사랑방 고스톱 소개 보기</a>
    </div>
  </section>

  <section aria-labelledby="contact">
    <h2 id="contact">연락처</h2>
    <div class="card">
      <dl>
        <dt>상호</dt><dd>코드캣(codecat)</dd>
        <dt>메일</dt><dd>support@codecat.co.kr</dd>
      </dl>
    </div>
  </section>

  <section aria-labelledby="docs">
    <h2 id="docs">안내</h2>
    <ul class="links">
      <li><a href="https://codecat.co.kr/sarangbang/privacy.html">개인정보 처리방침</a></li>
      <li><a href="https://codecat.co.kr/sarangbang/support.html">도움말·문의</a></li>
