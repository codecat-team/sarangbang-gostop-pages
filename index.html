<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>코드캣(codecat) — 쓸모 있는 앱을 만듭니다</title>
<!-- 시안 B '남색 밤' (참고: Lux(Halide)·Panic — 어두운 바탕, 왼쪽 정렬 큰 글, 고양이를 크게 세움). 글은 75b0df6 그대로. -->
<link rel="icon" type="image/svg+xml" href="company-mark.svg">
<style>
:root{--bg:#121F42;--bg2:#1D3170;--ink:#F7F3E8;--sub:#B9C2D6;--line:#2C3B6B;--orange:#DB9166;--tile:#FAF5EE}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;font-size:20px;line-height:1.65;-webkit-text-size-adjust:100%}
a{color:var(--orange);font-weight:700;text-decoration:none}
a:focus-visible{outline:3px solid var(--ink);outline-offset:4px;border-radius:6px}
.wrap{max-width:1240px;margin:0 auto;padding:0 64px}
header .wrap{display:flex;align-items:center;gap:16px;height:104px}
.tile{background:var(--tile);border-radius:14px;display:grid;place-items:center}
header .tile{width:52px;height:52px}header .tile img{width:42px}
header .word{height:30px}
.hero{display:grid;grid-template-columns:1.25fr 1fr;gap:48px;align-items:center;padding:64px 0 112px}
h1{margin:0;font-size:92px;line-height:1.12;font-weight:800;letter-spacing:-.03em}
h1 span{color:var(--orange)}
.lead{margin:32px 0 0;max-width:600px;font-size:28px;color:var(--sub)}
.hero .tile{width:100%;max-width:420px;aspect-ratio:1;border-radius:96px;justify-self:end}
.hero .tile img{width:82%}
.label{display:flex;align-items:center;gap:16px;margin:0 0 28px;font-size:16px;font-weight:700;letter-spacing:.14em;color:var(--orange)}
.label::after{content:"";flex:1;height:1px;background:var(--line)}
.product{display:grid;grid-template-columns:176px 1fr auto;gap:48px;align-items:center;padding:52px 56px;background:var(--bg2);border:2px solid #34478A;border-radius:40px}
.product img{width:176px;height:176px;border-radius:40px;display:block}
.product b{display:block;font-size:50px;line-height:1.25;margin-bottom:12px}
.product p{margin:0;color:var(--sub);max-width:620px;font-size:24px}
.go{white-space:nowrap;font-size:23px;padding:18px 30px;border:3px solid var(--orange);border-radius:999px;background:rgba(219,145,102,.12)}
.info{display:grid;grid-template-columns:1fr 1fr;gap:64px;margin-top:64px}
dl{margin:0}dt{color:var(--sub);font-size:20px}dd{margin:0 0 16px;font-size:26px;font-weight:700}
ul{margin:0;padding:0;list-style:none}
ul a{display:flex;justify-content:space-between;padding:18px 0;border-bottom:1px solid var(--line);color:var(--ink);font-size:25px}
ul a::after{content:"→";color:var(--orange)}
ul li:first-child a{padding-top:0}
footer{margin-top:64px;padding:28px 0 40px;border-top:1px solid var(--line);color:var(--sub);font-size:16px}
/* 태블릿 */
@media (max-width:1024px){
  .wrap{padding:0 44px}
  .hero{grid-template-columns:1fr 240px;gap:32px;padding:40px 0 80px}
  h1{font-size:64px}.lead{font-size:23px}
  .hero .tile{border-radius:56px}
  .product{grid-template-columns:120px 1fr;gap:28px;padding:36px;border-radius:32px}.product b{font-size:38px}.product p{font-size:21px}
  .product img{width:120px;height:120px;border-radius:28px}
  .go{grid-column:2;justify-self:start}
  .info{gap:40px;margin-top:72px}
}
/* 폰: 고양이 먼저, 그다음 큰 글 한 줄씩 */
@media (max-width:600px){
  body{font-size:19px}
  .wrap{padding:0 22px}
  header .wrap{height:76px;gap:12px}header .tile{width:42px;height:42px;border-radius:12px}header .tile img{width:34px}header .word{height:24px}
  .hero{grid-template-columns:1fr;gap:28px;padding:16px 0 56px}
  .hero .tile{order:-1;justify-self:start;max-width:132px;border-radius:32px}
  h1{font-size:42px}.lead{font-size:21px;margin-top:18px}
  .product{grid-template-columns:1fr;gap:18px;padding:26px 22px;border-radius:22px}
  .product img{width:84px;height:84px;border-radius:20px}
  .product b{font-size:32px}.product p{font-size:19px}dd{font-size:22px}ul a{font-size:21px}
  .go{grid-column:auto;display:block;text-align:center}
  .info{grid-template-columns:1fr;gap:44px;margin-top:56px}
  footer{margin-top:64px}
}
</style></head>
<body>
<header><div class="wrap"><div class="tile"><img src="company-mark.svg" alt=""></div><img class="word" src="wordmark-cream.svg" alt="코드캣(codecat)"></div></header>
<main class="wrap">
  <div class="hero">
    <div><h1>쓸모 있는 앱을<br><span>만듭니다</span></h1>
    <p class="lead">코드캣(codecat)은 누구나 쉽게 쓰는 앱과 도구를 만드는 작은 팀이에요.</p></div>
    <div class="tile"><img src="company-mark.svg" alt=""></div>
  </div>
  <section aria-labelledby="work">
    <h2 class="label" id="work">만드는 것</h2>
    <div class="product">
      <img src="sarangbang-icon.png" alt="">
      <div><b>사랑방 고스톱</b><p>큰 글씨로 누르기만 하면 되는 고스톱·맞고 앱이에요. 어르신도, 가족과 함께도 편하게 즐겨요. 광고는 지나치지 않게, 개인정보는 꼭 필요한 만큼만 다뤄요.</p></div>
      <a class="go" href="https://codecat.co.kr/sarangbang/">사랑방 고스톱 소개 보기</a>
    </div>
  </section>
  <div class="info">
    <section aria-labelledby="contact"><h2 class="label" id="contact">연락처</h2>
      <dl><dt>상호</dt><dd>코드캣(codecat)</dd><dt>메일</dt><dd>support@codecat.co.kr</dd></dl></section>
    <section aria-labelledby="docs"><h2 class="label" id="docs">안내</h2>
      <ul><li><a href="https://codecat.co.kr/sarangbang/privacy.html">개인정보 처리방침</a></li><li><a href="https://codecat.co.kr/sarangbang/support.html">도움말·문의</a></li></ul></section>
  </div>
</main>
<footer><div class="wrap">© 코드캣(codecat)</div></footer>
</body></html>
