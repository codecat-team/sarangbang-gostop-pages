body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;word-break:keep-all;line-height:1.45}
.w{max-width:30rem;margin:0 auto;padding:1.2rem 1.1rem 2rem;min-height:100vh;display:flex;flex-direction:column}
.brand{display:flex;align-items:center;gap:.45rem;font-size:.9rem;font-weight:800}

.item{margin-top:1.4rem;background:var(--card);border:1px solid var(--line);border-radius:1.1rem;padding:1.1rem}
.item[hidden]{display:none}

.appline{display:flex;align-items:center;gap:.75rem;margin-top:1.4rem}

.badge small{display:block;font-size:.65rem;font-weight:500;opacity:.85}
.badge .bx{display:flex;flex-direction:column;line-height:1.15}

</div>
<script>
(function(){
var APP={play:'https://play.google.com/store/apps/details?id=kr.co.codecat.hyuyangrim',ios:''};
var $=function(i){return document.getElementById(i)};
var P=new URLSearchParams(location.search);
var WD=['일','월','화','수','목','금','토'];
function ymd(s){var m=/^(\d{4})-?(\d{2})-?(\d{2})$/.exec(String(s||''));if(!m)return null;var y=+m[1],mo=+m[2],d=+m[3];var dt=new Date(y,mo-1,d);if(dt.getFullYear()!==y||dt.getMonth()!==mo-1||dt.getDate()!==d)return null;return dt}
function fmt(dt,withMonth){return (withMonth===false?'':(dt.getMonth()+1)+'월 ')+dt.getDate()+'일('+WD[dt.getDay()]+')'}
function show(k,h,d,s){var it=$('item');$('k').textContent=k;$('h').textContent=h;$('d').textContent=d||'';$('s').textContent=s||'';it.hidden=false;return $('s')}
function badges(){
 var ua=navigator.userAgent||'';var ios=/iPhone|iPad|iPod/.test(ua)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);var and=/Android/.test(ua);
 var b=$('badges');b.textContent='';
 function mk(label,store,url,dim){var a=document.createElement(url?'a':'div');a.className='badge'+(dim?' dim':'');if(url){a.href=url;a.rel='noopener'}var bx=document.createElement('span');bx.className='bx';var sm=document.createElement('small');sm.textContent=url?'다운로드하기':'준비 중이에요';bx.appendChild(sm);bx.appendChild(document.createTextNode(store));a.appendChild(bx);return a}
 var ap=mk('','App Store',APP.ios,false),gp=mk('','Google Play',APP.play,false);
 var first=ios?[ap,gp]:and?[gp,ap]:[gp,ap];
 first.forEach(function(x,i){if(i)x.classList.add('dim');b.appendChild(x)});
 if(!ios&&!and)$('note').textContent='휴대폰에서 열어 주세요.';
}

function gone(){show('휴양림','이 휴양림을 지금은 찾지 못했어요','','');$('d').textContent='앱에서 직접 찾아볼 수 있어요.'}
var f=P.get('f');
if(/^[A-Za-z0-9_-]{3,40}$/.test(f||'')){
 var c=new AbortController();setTimeout(function(){c.abort()},10000);
 fetch('../rules.json',{signal:c.signal,credentials:'omit',referrerPolicy:'no-referrer'}).then(function(r){if(!r.ok)throw 0;return r.json()}).then(function(j){
  var v=(j.forests||[]).filter(function(x){return x&&x.venueId===f})[0];if(!v||!v.name){gone();return}
  show('친구가 보낸 휴양림',String(v.name).slice(0,60),'',String(v.region||'').slice(0,20));
  $('d').textContent='예약이 열리는 시각은 받은 글에 있어요. 앱에서 알림으로 받을 수 있어요.';
 }).catch(function(){gone()});
}else if(f){gone()}

badges();
})();
</script></body></html>
