name: refresh-icons
on:
  schedule: [{cron: "17 3 * * *"}]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  icons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install pillow
      - run: python3 scripts/refresh-icons.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sigol-jangteo/s/icon.png hyuyangrim/s/icon.png sigol-jangteo/s/og.png hyuyangrim/s/og.png
          git diff --cached --quiet || git commit -m "chore(site): refresh app icons from the App Store" && git push
